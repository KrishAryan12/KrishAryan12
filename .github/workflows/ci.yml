# Quality gates for every push and pull request: typecheck, privacy / claims / SVG / text-size /
# size / accessibility lints, a check that generated files are committed, and the link check.
name: ci

on:
  push:
    branches: [main, redesign]
  pull_request:
  schedule:
    - cron: '41 4 * * 1' # weekly link check catches rot even without commits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files are up to date
        # Builds with the date of the last commit so month-based tenure matches what was committed.
        run: |
          export BUILD_DATE="$(git log -1 --format=%cs)"
          pnpm build
          git diff --stat --exit-code -- README.md assets tokens.json || {
            echo "::error::Generated files differ from the commit. Run 'pnpm build' and commit the result."
            exit 1
          }
      - run: pnpm check

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:links
