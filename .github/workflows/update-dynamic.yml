# Daily telemetry. Generates the activity panel, the footer stamp, state.json, the weekly Teardown
# scoreboard and (only above the contribution threshold) the 3D contribution graph, and publishes
# them to the `output` branch so main's history stays clean.
#
# The generate job is read-only. Only the publish job can write, and it only pushes generated files.
# It commits to main only when month-based values (tenure) or a dynamic section changes the README.
name: update-dynamic

on:
  schedule:
    - cron: '17 2 * * *' # 07:47 IST
  workflow_dispatch:
    inputs:
      scoreboard:
        description: Run the Teardown scan now (normally Mondays only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-dynamic
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Fetch the last good output (fail-safe source)
        run: git clone --depth 1 --branch output "https://github.com/${GITHUB_REPOSITORY}.git" .dynamic || mkdir -p .dynamic
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate activity, stamp, state (and the weekly scoreboard)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAG=""
          # One scan a week keeps the free Teardown deployment inside its limits.
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.scoreboard }}" = "true" ]; then FLAG="--scoreboard"; fi
          pnpm dynamic --out .dynamic $FLAG
          echo "contrib=$(node -p "require('./.dynamic/state.json').contribGraph")" >> "$GITHUB_ENV"

      - name: 3D contribution graph (only above the threshold)
        if: env.contrib == 'true'
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Keep only the dark 3D graph
        if: env.contrib == 'true'
        run: cp profile-3d-contrib/profile-night-view.svg .dynamic/contrib-3d.svg

      - name: Rebuild panels and README with today's date and state
        run: DYNAMIC_STATE=.dynamic/state.json pnpm build

      - name: Collect results
        run: |
          mkdir -p out/output out/main/assets
          find .dynamic -maxdepth 1 -type f \( -name '*.svg' -o -name 'state.json' \) -exec cp {} out/output/ \;
          cp README.md out/main/
          cp -r assets/panels out/main/assets/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated
          path: out/
          retention-days: 3

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated
          path: ${{ runner.temp }}/gen
      - name: Publish to the output branch (single squashed commit)
        env:
          GEN: ${{ runner.temp }}/gen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WT="$RUNNER_TEMP/output"
          git worktree add --detach "$WT"
          cd "$WT"
          git checkout --orphan output-new
          git rm -rfq . || true
          cp "$GEN"/output/* .
          printf '# output\n\nGenerated daily by .github/workflows/update-dynamic.yml. Do not edit.\n' > README.md
          git add -A
          git commit -qm "chore: regenerate dynamic panels"
          git push -f origin output-new:output
      - name: Commit README/panels to main only if month-based values changed
        env:
          GEN: ${{ runner.temp }}/gen
        run: |
          cp "$GEN"/main/README.md README.md
          cp "$GEN"/main/assets/panels/*.svg assets/panels/
          if git diff --quiet; then echo "main unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/panels
          git commit -qm "chore: regenerate README (tenure / dynamic sections)"
          git push origin HEAD:main
